<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lattice Studio</title>
  <style>
:root {
  --bg: #0e0f13;
  --panel: #16181f;
  --panel-2: #1d2029;
  --line: #2a2e3a;
  --text: #e7e9ef;
  --muted: #8b90a0;
  --accent: #6c8cff;
  --accent-2: #ff5fa8;
  --danger: #ff6b6b;
  --radius: 8px;
  font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 13px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
body {
  display: grid;
  grid-template-columns: 236px 1fr 320px;
  grid-template-rows: 48px 1fr 52px;
  grid-template-areas: "top top top" "left stage right" "time time right";
}
button, select, input, textarea { font: inherit; color: inherit; }
button {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 10px; cursor: pointer; white-space: nowrap;
}
button:hover { border-color: #3c4253; background: #232733; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.accent { background: transparent; border-color: var(--accent-2); color: #ffd0e6; }
button.danger:hover { border-color: var(--danger); color: var(--danger); }
button.icon { padding: 6px 10px; min-width: 34px; }
button:disabled { opacity: .45; cursor: default; }
select, input[type=text], input[type=number], textarea {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px;
}
textarea { width: 100%; resize: vertical; min-height: 64px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }

#topbar {
  grid-area: top; display: flex; align-items: center; gap: 8px; padding: 0 12px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 6px; margin-right: 8px; color: var(--accent); }
.brand b { color: var(--text); font-size: 15px; letter-spacing: .2px; }
.brand span { color: var(--muted); }
.btn-group { display: flex; }
.btn-group button { border-radius: 0; margin-left: -1px; }
.btn-group button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.btn-group button:last-child { border-radius: 0 6px 6px 0; }
.grow { flex: 1; }

#left, #right { background: var(--panel); overflow-y: auto; }
#left { grid-area: left; border-right: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
#right { grid-area: right; border-left: 1px solid var(--line); }
.panel-title { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 2px 2px 0; }
.panel-title.small { margin-top: 6px; }
#layerList { display: flex; flex-direction: column; gap: 3px; }
.layer {
  display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 6px;
  border: 1px solid transparent; cursor: pointer; user-select: none;
}
.layer:hover { background: var(--panel-2); }
.layer.sel { background: #222842; border-color: #3a4780; }
.layer .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer .type { font-size: 10.5px; color: var(--muted); }
.layer .eye { background: none; border: 0; padding: 0 2px; color: var(--muted); font-size: 13px; }
.layer.hidden .name { color: var(--muted); text-decoration: line-through; }
.layer.scene { margin-bottom: 4px; border-bottom: 1px solid var(--line); border-radius: 6px 6px 0 0; }
.add-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.add-grid button { font-size: 12px; padding: 7px 6px; }
.layer-actions { display: flex; gap: 5px; }
.layer-actions button { flex: 1; padding: 6px 4px; font-size: 12px; }
.hint { color: var(--muted); font-size: 11.5px; line-height: 1.5; margin-top: auto; }

#stage { grid-area: stage; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden;
  background: repeating-conic-gradient(#121319 0 25%, #0f1015 0 50%) 0 0 / 22px 22px; }
#frame { position: relative; box-shadow: 0 0 0 1px #2c3140, 0 12px 40px rgba(0,0,0,.5); background: #000; }
#hud { position: absolute; left: 10px; top: 8px; color: var(--muted); font-size: 11px; pointer-events: none; }

#timeline { grid-area: time; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--panel); border-top: 1px solid var(--line); }
#timeLabel { font-variant-numeric: tabular-nums; min-width: 92px; color: var(--muted); }
#fpsLabel { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 52px; text-align: right; }
#scrub { flex: 1; }
label.inline { display: flex; align-items: center; gap: 6px; color: var(--muted); }

/* properties */
.props-head { position: sticky; top: 0; z-index: 2; background: var(--panel); padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; align-items: center; }
.props-head input { flex: 1; min-width: 0; font-weight: 600; }
.props-head .tag { font-size: 11px; color: var(--muted); }
details.group { border-bottom: 1px solid var(--line); }
details.group > summary { list-style: none; cursor: pointer; padding: 9px 12px; font-weight: 600; font-size: 12px; display: flex; justify-content: space-between; }
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary::after { content: "+"; color: var(--muted); }
details.group[open] > summary::after { content: "\2212"; }
.fields { padding: 2px 12px 10px; display: flex; flex-direction: column; gap: 7px; }
.field { display: grid; grid-template-columns: 112px 1fr 56px; align-items: center; gap: 8px; }
.field > label { color: #c3c7d3; font-size: 12px; line-height: 1.2; cursor: default; }
.field.wide { grid-template-columns: 112px 1fr; }
.field.block { grid-template-columns: 1fr; }
.field input[type=number] { width: 56px; padding: 3px 4px; font-size: 12px; text-align: right; }
.field select { width: 100%; }
.field input[type=color] { width: 100%; height: 26px; padding: 0 2px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.switch { justify-self: start; width: 18px; height: 18px; accent-color: var(--accent); }
.media-box { display: flex; flex-direction: column; gap: 6px; }
.media-row { display: flex; gap: 6px; align-items: center; }
.media-row button, .media-row select { flex: 1; font-size: 12px; padding: 5px 6px; }
.media-thumb { width: 100%; height: 74px; border-radius: 6px; background: #0b0c10 center/cover no-repeat; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; overflow: hidden; }
.media-thumb video { width: 100%; height: 100%; object-fit: cover; }

/* modal */
#modal { position: fixed; inset: 0; background: rgba(5,6,10,.7); display: flex; align-items: center; justify-content: center; z-index: 50; }
#modal[hidden] { display: none; }
.modal-card { width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.modal-head h2 { margin: 0; font-size: 16px; }
.modal-card p { color: #c3c7d3; line-height: 1.55; margin: 6px 0 12px; }
.modal-card code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
.form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.form-row label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.progress { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin: 10px 0 4px; }
.progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .1s; }
.code { min-height: 170px; }

#toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); background: #262b3a; border: 1px solid #3a4258; padding: 9px 14px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60; max-width: 80vw; }
#toast.show { opacity: 1; }

@media (max-width: 900px) {
  body { grid-template-columns: 1fr; grid-template-rows: 48px 45vh 52px auto auto; grid-template-areas: "top" "stage" "time" "right" "left"; overflow: auto; height: auto; }
  html, body { overflow: auto; }
  #topbar { overflow-x: auto; }
}

  <script>

    props.appendChild(head);

    groups.forEach(function (g, gi) {
      var key = (layer ? layer.type : 'scene') + ':' + g.name;
      var isOpen = openGroups[key] !== undefined ? openGroups[key] : gi < 3;
      var det = el('details', { class: 'group' });
      det.open = isOpen;
      det.addEventListener('toggle', function () { openGroups[key] = det.open; });
      det.appendChild(el('summary', { text: g.name }));
      var box = el('div', { class: 'fields' });
      g.fields.forEach(function (f) { box.appendChild(fieldRow(f, obj, set)); });
      det.appendChild(box);
      props.appendChild(det);
    });
  }

  function fieldRow(f, obj, set) {
    var label = el('label', { text: f.label, title: 'Double-click to reset' });
    label.addEventListener('dblclick', function () { obj[f.key] = f.def; set(f.key, f.def); renderProps(); commit(); });
    var v = obj[f.key];
    switch (f.type) {
      case 'range': {
        var range = el('input', { type: 'range', min: f.min, max: f.max, step: f.step, value: v, 'aria-label': f.label });
        var num = el('input', { type: 'number', min: f.min, max: f.max, step: f.step, value: v, 'aria-label': f.label + ' value' });
        var apply = function (val, src) {
          val = parseFloat(val); if (!isFinite(val)) return;
          obj[f.key] = val; set(f.key, val);
          if (src !== range) range.value = val;
          if (src !== num) num.value = val;
          commitSoon();
        };
        range.addEventListener('input', function () { apply(range.value, range); });
        num.addEventListener('change', function () { apply(num.value, num); });
        return el('div', { class: 'field' }, [label, range, num]);
      }
      case 'color': {
        var c = el('input', { type: 'color', value: v, 'aria-label': f.label });
        c.addEventListener('input', function () { obj[f.key] = c.value; set(f.key, c.value); commitSoon(); });
        return el('div', { class: 'field wide' }, [label, c]);
      }
      case 'select': {
        var s = el('select', { 'aria-label': f.label });
        f.options.forEach(function (o) { var opt = el('option', { value: optValue(o), text: optLabel(o) }); if (optValue(o) === v) opt.selected = true; s.appendChild(opt); });
        s.addEventListener('change', function () { obj[f.key] = s.value; set(f.key, s.value); commit(); if (f.key === 'camMode') renderProps(); });
        return el('div', { class: 'field wide' }, [label, s]);
      }
      case 'bool': {
        var b = el('input', { type: 'checkbox', class: 'switch', 'aria-label': f.label });
        b.checked = !!v;
        b.addEventListener('change', function () { obj[f.key] = b.checked; set(f.key, b.checked); commit(); });
        return el('div', { class: 'field wide' }, [label, b]);
      }
      case 'text': {
        var ta = el('textarea', { placeholder: '51.5, -0.12\n40.7, -74.0\n35.7, 139.7', 'aria-label': f.label });
        ta.value = v || '';
        ta.addEventListener('change', function () { obj[f.key] = ta.value; set(f.key, ta.value); commit(); });
        return el('div', { class: 'field block' }, [label, ta]);
      }
      case 'media': return mediaField(f, obj, set, label);
    }
    return el('div');
  }

  function mediaField(f, obj, set, label) {
    var v = obj[f.key] || '';
    var thumb = el('div', { class: 'media-thumb' });
    if (!v) thumb.textContent = 'No media';
    else if (/^builtin:/.test(v)) thumb.textContent = v.replace('builtin:', 'Built-in: ');
    else if (/^data:video|\.(mp4|webm|mov|m4v)/i.test(v) || engine.mediaKinds[v] === 'video') { var vid = el('video', { src: v, muted: '', autoplay: '', loop: '', playsinline: '' }); vid.muted = true; thumb.appendChild(vid); }
    else thumb.style.backgroundImage = 'url("' + v.replace(/"/g, '%22') + '")';
    var apply = function (val) { obj[f.key] = val; set(f.key, val); commit(); renderProps(); };
    var builtin = el('select', { 'aria-label': 'Built-in textures' }, [
      el('option', { value: '', text: 'Built-in…' }), el('option', { value: 'builtin:testcard', text: 'Test card' }), el('option', { value: 'builtin:stripes', text: 'Stripes' })
    ]);
    builtin.addEventListener('change', function () { if (builtin.value) apply(builtin.value); });
    var url = el('input', { type: 'text', placeholder: 'or paste an image / video URL', value: /^(https?:)?\/\//.test(v) ? v : '' });
    url.addEventListener('change', function () { apply(url.value.trim()); });
    return el('div', { class: 'field block' }, [label, el('div', { class: 'media-box' }, [
      thumb,
      el('div', { class: 'media-row' }, [
        el('button', { text: 'Upload…', onclick: function () { pickMedia(apply); } }),
        builtin,
        el('button', { text: 'Clear', onclick: function () { apply(''); } })
      ]),
      url
    ])]);
  }

  // Images are downscaled to <= 2048 px and stored inline so scenes stay self-contained.
  function pickMedia(apply) {
    var input = $('#fileMedia'); input.value = '';
    input.onchange = function () {
      var file = input.files[0]; if (!file) return;
      if (/^video\//.test(file.type)) {
        if (file.size <= 15 * 1024 * 1024) {
          var fr = new FileReader(); fr.onload = function () { apply(fr.result); toast('Video added and saved inside the scene.'); }; fr.readAsDataURL(file);
        } else {
          var u = URL.createObjectURL(file); engine.registerMedia(u, 'video'); apply(u);
          toast('Large video: it plays here, but host it and paste its URL before saving or embedding.', 6000);
        }
        return;
      }
      var img = new Image();
      img.onload = function () {
        var max = 2048, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        var c = el('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        apply(file.type === 'image/png' || file.type === 'image/svg+xml' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.9));
        URL.revokeObjectURL(img.src);
      };
      img.onerror = function () { toast('That image could not be read.'); };
      img.src = URL.createObjectURL(file);
    };
    input.click();
  }

  function onSetting(k) {
    if (k === 'duration') $('#scrub').max = scene.settings.duration;
  }

  // ---------- randomise ----------
  var NO_RANDOM = { opacity: 1, blend: 1, mediaMode: 1, material: 0, colorMode: 0 };
  function rand(a, b) { return a + Math.random() * (b - a); }
  function hsl(h, s, l) {
    var c = new THREE.Color(); c.setHSL(((h % 1) + 1) % 1, s, l); return '#' + c.getHexString();
  }
  function randomize() {
    var layer = selected === 'scene' ? null : findLayer(selected);
    if (!layer) {
      var h = Math.random(), st = scene.settings;
      st.bg1 = hsl(h, 0.5, 0.12); st.bg2 = hsl(h + 0.05, 0.6, 0.02);
      st.bloom = +rand(0, 1.4).toFixed(2); st.camMode = ['orbit', 'pendulum', 'dolly', 'crane', 'orbit'][Math.floor(Math.random() * 5)];
      st.camHeight = +rand(-2, 14).toFixed(1);
    } else {
      Lx.SCHEMA[layer.type].forEach(function (g) {
        if (g.name === 'Transform') return;
        g.fields.forEach(function (f) {
          if (f.nr || NO_RANDOM[f.key]) return;
          var p = layer.params;
          if (f.type === 'range') {
            var val = /Cycles$/.test(f.key) ? Math.round(rand(0, 2)) : f.min + (f.max - f.min) * Math.pow(Math.random(), 2.2);
            p[f.key] = Math.round(val / f.step) * f.step;
            p[f.key] = +p[f.key].toFixed(4);
          } else if (f.type === 'select') {
            var opts = f.options.map(optValue).filter(function (o) { return o !== 'image' && o !== 'glass'; });
            p[f.key] = opts[Math.floor(Math.random() * opts.length)];
          } else if (f.type === 'bool' && f.key !== 'landMask') p[f.key] = Math.random() > 0.5;
        });
        var hue = Math.random();
        layer.params.colorA = hsl(hue, 0.85, 0.6); layer.params.colorB = hsl(hue + rand(0.25, 0.6), 0.85, 0.55);
      });
    }
    scene = engine.load(scene); renderProps(); commit();
  }

  // ---------- top bar ----------
  var presetSel = $('#presetSel');
  presetSel.appendChild(el('option', { value: '', text: 'Presets…' }));
  Object.keys(Lx.PRESET_NAMES).forEach(function (k) { presetSel.appendChild(el('option', { value: k, text: Lx.PRESET_NAMES[k] })); });
  presetSel.addEventListener('change', function () { if (!presetSel.value) return; loadScene(Lx.preset(presetSel.value)); toast('Loaded preset: ' + Lx.PRESET_NAMES[presetSel.value]); presetSel.value = ''; });

  $('#btnNew').onclick = function () { loadScene({ settings: {}, layers: [Lx.newLayer('grid')] }); };
  $('#btnSave').onclick = function () {
    download(new Blob([JSON.stringify(scene, null, 2)], { type: 'application/json' }), slug(scene.layers[0] && scene.layers[0].name) + '.lattice.json');
  };
  $('#btnOpen').onclick = function () { $('#fileOpen').value = ''; $('#fileOpen').click(); };
  $('#fileOpen').onchange = function (e) {
    var f = e.target.files[0]; if (!f) return;
    f.text().then(function (t) { loadScene(JSON.parse(t)); toast('Opened ' + f.name); }).catch(function () { toast('That file is not a Lattice scene.'); });
  };
  $('#btnUndo').onclick = undo; $('#btnRedo').onclick = redo;
  $('#btnRandom').onclick = randomize;
  $('#btnCam').onclick = function () { engine.userCam = false; engine._freeInit = false; engine.applySettings(); toast('Camera reset'); };

  // ---------- layer actions ----------
  Array.prototype.forEach.call(document.querySelectorAll('[data-add]'), function (b) {
    b.onclick = function () {
      var l = Lx.newLayer(b.getAttribute('data-add'));
      if (l.type === 'media') l.params.media = 'builtin:testcard';
      engine.addLayer(l); select(l.id); commit();
    };
  });
  $('#btnDup').onclick = function () {
    var l = findLayer(selected); if (!l) return;
    var c = JSON.parse(JSON.stringify(l)); c.id = Lx.uid(); c.name = l.name + ' copy';
    engine.addLayer(c); select(c.id); commit();
  };
  $('#btnDel').onclick = function () {
    var l = findLayer(selected); if (!l) return;
    engine.removeLayer(l.id); scene = engine.data; select('scene'); commit();
  };
  function move(dir) {
    var i = scene.layers.findIndex(function (l) { return l.id === selected; }), j = i + dir;
    if (i < 0 || j < 0 || j >= scene.layers.length) return;
    var t = scene.layers[i]; scene.layers[i] = scene.layers[j]; scene.layers[j] = t;
    renderLayers(); commit();
  }
  $('#btnUp').onclick = function () { move(-1); };
  $('#btnDown').onclick = function () { move(1); };

  // ---------- timeline ----------
  var scrub = $('#scrub'), scrubbing = false, playBtn = $('#btnPlay');
  function setPlaying(p) { if (p) engine.play(); else engine.pause(); playBtn.textContent = p ? 'Pause' : 'Play'; }
  playBtn.onclick = function () { setPlaying(!engine.playing); };
  scrub.addEventListener('input', function () { scrubbing = true; engine.setTime(parseFloat(scrub.value)); });
  scrub.addEventListener('change', function () { scrubbing = false; });
  $('#aspectSel').addEventListener('change', function (e) { scene.settings.aspect = e.target.value; layoutFrame(); commit(); });
  engine.onFrame = function (t) {
    if (!scrubbing) scrub.value = t;
    $('#timeLabel').textContent = t.toFixed(2) + ' / ' + scene.settings.duration + ' s';
    $('#fpsLabel').textContent = engine.fps + ' fps';
  };

  // ---------- modal + exports ----------
  function openModal(title, body) {
    $('#modalTitle').textContent = title;
    var b = $('#modalBody'); b.innerHTML = ''; b.appendChild(body);
    $('#modal').hidden = false;
  }
  function closeModal() { if (exportCancel) exportCancel.flag = true; $('#modal').hidden = true; }
  $('#modalClose').onclick = closeModal;
  $('#modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });

  function sizeFor(longSide) {
    var a = aspectValue() || (frame.clientWidth / frame.clientHeight);
    var w, h;
    if (a >= 1) { w = longSide; h = longSide / a; } else { h = longSide; w = longSide * a; }
    return [Math.round(w / 2) * 2, Math.round(h / 2) * 2];
  }
  function sizeSelect(options, def) {
    var s = el('select');
    options.forEach(function (L) { var wh = sizeFor(L); s.appendChild(el('option', { value: L, text: wh[0] + ' × ' + wh[1] })); });
    s.value = def; return s;
  }

  $('#btnPng').onclick = function () {
    var size = sizeSelect([1280, 1920, 3840, 7680], 1920);
    var body = el('div', null, [
      el('p', { text: 'Exports the current frame as a PNG. A transparent background is kept when Background is set to Transparent.' }),
      el('div', { class: 'form-row' }, [el('label', null, ['Size', size])]),
      el('div', { class: 'modal-actions' }, [el('button', { class: 'primary', text: 'Download PNG', onclick: function () {
        var wh = sizeFor(parseInt(size.value, 10));
        engine.snapshot(wh[0], wh[1]).then(function (b) { download(b, 'lattice-' + wh[0] + 'x' + wh[1] + '.png'); closeModal(); });
      } })])
    ]);
    openModal('Export image', body);
  };

  var exportCancel = null;
  function loadScript(src) {
    return new Promise(function (res, rej) { var s = el('script', { src: src }); s.onload = res; s.onerror = function () { rej(new Error('Could not load ' + src)); }; document.head.appendChild(s); });
  }
  function pickCodec(w, h, fps) {
    var list = ['avc1.640034', 'avc1.640033', 'avc1.64002a', 'avc1.4d0034', 'avc1.42003e'];
    var i = 0;
    function next() {
      if (i >= list.length) return Promise.reject(new Error('No H.264 encoder for ' + w + '×' + h));
      var codec = list[i++];
      return VideoEncoder.isConfigSupported({ codec: codec, width: w, height: h, bitrate: 8e6, framerate: fps })
        .then(function (r) { return r.supported ? codec : next(); }, next);
    }
    return next();
  }
  // Frame-accurate MP4 through WebCodecs + mp4-muxer.
  function exportMP4(w, h, fps, progress, cancel) {
    var muxerReady = window.Mp4Muxer ? Promise.resolve() : loadScript('https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js');
    return muxerReady.then(function () { return pickCodec(w, h, fps); }).then(function (codec) {
      var target = new Mp4Muxer.ArrayBufferTarget();
      var muxer = new Mp4Muxer.Muxer({ target: target, video: { codec: 'avc', width: w, height: h }, fastStart: 'in-memory' });
      var encErr = null;
      var enc = new VideoEncoder({ output: function (chunk, meta) { muxer.addVideoChunk(chunk, meta); }, error: function (e) { encErr = e; } });
      enc.configure({ codec: codec, width: w, height: h, bitrate: Math.min(60e6, Math.round(w * h * fps * 0.15)), framerate: fps });
      var wait = function () { return new Promise(function (r) { setTimeout(r, 0); }); };
      return engine.renderSequence(w, h, fps, function (canvas, i, total) {
        if (cancel.flag) throw new Error('cancelled');
        if (encErr) throw encErr;
        var vf = new VideoFrame(canvas, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
        enc.encode(vf, { keyFrame: i % (fps * 2) === 0 }); vf.close();
        progress((i + 1) / total);
        var drain = function () { return enc.encodeQueueSize > 6 ? wait().then(drain) : wait(); };
        return drain();
      }).then(function () { return enc.flush(); }).then(function () {
        muxer.finalize(); enc.close();
        return new Blob([target.buffer], { type: 'video/mp4' });
      }, function (err) { try { enc.close(); } catch (e) { /* already closed */ } throw err; });
    });
  }
  // Fallback: real-time WebM via MediaRecorder (browsers without WebCodecs).
  function exportRealtime(w, h, fps, progress, cancel) {
    var mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].filter(function (m) { return window.MediaRecorder && MediaRecorder.isTypeSupported(m); })[0];
    if (!mime) return Promise.reject(new Error('This browser cannot record video. Try Chrome or Edge.'));
    var r = engine.renderer, pr = r.getPixelRatio(), s = scene.settings, ms = s.duration / s.speed * 1000;
    engine._fixed = true; r.setPixelRatio(1); engine._setSize(w, h);
    var stream = r.domElement.captureStream(fps), chunks = [];
    var rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: Math.min(40e6, w * h * fps * 0.12) });
    rec.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
    engine.setTime(0); setPlaying(true);
    return new Promise(function (res, rej) {
      var t0 = performance.now();
      var iv = setInterval(function () {
        var f = (performance.now() - t0) / ms; progress(Math.min(1, f));
        if (cancel.flag || f >= 1) { clearInterval(iv); rec.stop(); }
      }, 100);
      rec.onstop = function () {
        engine._fixed = false; r.setPixelRatio(pr); engine.resize();
        if (cancel.flag) rej(new Error('cancelled')); else res(new Blob(chunks, { type: 'video/webm' }));
      };
      rec.start();
    });
  }

  $('#btnVideo').onclick = function () {
    var canMP4 = 'VideoEncoder' in window && 'VideoFrame' in window;
    var size = sizeSelect([1280, 1920, 3840], 1920);
    var fps = el('select', null, [el('option', { value: 30, text: '30 fps' }), el('option', { value: 60, text: '60 fps' }), el('option', { value: 25, text: '25 fps' }), el('option', { value: 24, text: '24 fps' })]);
    fps.value = '30';
    var fmt = el('select', null, [
      canMP4 ? el('option', { value: 'mp4', text: 'MP4 (H.264, frame-accurate)' }) : null,
      el('option', { value: 'webm', text: 'WebM (records in real time)' })
    ]);
    var bar = el('div'), status = el('p', { text: '' });
    var go = el('button', { class: 'primary', text: 'Render video' });
    var s = scene.settings;
    go.onclick = function () {
      var wh = sizeFor(parseInt(size.value, 10)), f = parseInt(fps.value, 10);
      exportCancel = { flag: false };
      go.disabled = true; status.textContent = 'Rendering ' + wh[0] + '×' + wh[1] + '…';
      var prog = function (x) { bar.style.width = Math.round(x * 100) + '%'; };
      var job = fmt.value === 'mp4' ? exportMP4(wh[0], wh[1], f, prog, exportCancel) : exportRealtime(wh[0], wh[1], f, prog, exportCancel);
      job.then(function (blob) {
        download(blob, 'lattice-' + wh[0] + 'x' + wh[1] + '.' + (fmt.value === 'mp4' ? 'mp4' : 'webm'));
        status.textContent = 'Done: ' + (blob.size / 1048576).toFixed(1) + ' MB'; go.disabled = false; exportCancel = null;
      }, function (err) {
        go.disabled = false; exportCancel = null;
        status.textContent = err.message === 'cancelled' ? 'Cancelled.' : 'Export failed: ' + err.message;
      });
    };
    openModal('Export video', el('div', null, [
      el('p', { text: 'Renders one full loop (' + (s.duration / s.speed).toFixed(1) + ' s) at an exact frame rate. Turn on Seamless loop in Scene settings for a loop with no jump.' }),
      el('div', { class: 'form-row' }, [el('label', null, ['Size', size]), el('label', null, ['Frame rate', fps]), el('label', null, ['Format', fmt])]),
      el('div', { class: 'progress' }, [bar]), status,
      el('div', { class: 'modal-actions' }, [el('button', { text: 'Cancel', onclick: closeModal }), go])
    ]));
  };

  function embedSnippet(useSrc) {
    var aspect = (scene.settings.aspect && scene.settings.aspect !== 'free' ? scene.settings.aspect : '16:9').replace(':', ' / ');
    var head = '<!-- Lattice scene. Upload lattice-widget.js and lattice-engine.js to /lattice/ on your site. -->\n<script src="/lattice/lattice-widget.js" defer><\/script>\n';
    if (useSrc) return head + '<lattice-scene src="/lattice/scenes/my-scene.json" style="display:block;width:100%;aspect-ratio:' + aspect + '"></lattice-scene>';
    var json = JSON.stringify(scene).replace(/<\//g, '<\\/');
    return head + '<lattice-scene style="display:block;width:100%;aspect-ratio:' + aspect + '">\n  <script type="application/json">' + json + '<\/script>\n</lattice-scene>';
  }
  $('#btnEmbed').onclick = function () {
    var mode = el('select', null, [el('option', { value: 'inline', text: 'Scene inside the snippet' }), el('option', { value: 'src', text: 'Scene as a separate .json file' })]);
    var code = el('textarea', { class: 'code', readonly: '', spellcheck: 'false' });
    var refresh = function () { code.value = embedSnippet(mode.value === 'src'); };
    mode.onchange = refresh; refresh();
    var hasBlob = scene.layers.some(function (l) { return /^blob:/.test(l.params.media || ''); });
    openModal('Embed on a website', el('div', null, [
      el('p', null, ['Paste this where the animation should appear. The ', el('code', { text: '<lattice-scene>' }), ' tag sizes to its container, pauses when scrolled off screen and respects reduced-motion settings. Add ', el('code', { text: 'interactive' }), ' to let visitors drag the camera.']),
      hasBlob ? el('p', { text: 'Warning: one layer uses a large local video. Host that video and paste its URL in the layer before embedding.' }) : null,
      el('div', { class: 'form-row' }, [el('label', null, ['Snippet style', mode])]),
      code,
      el('div', { class: 'modal-actions' }, [
        el('button', { text: 'Download scene .json', onclick: function () { download(new Blob([JSON.stringify(scene)], { type: 'application/json' }), 'my-scene.json'); } }),
        el('button', { text: 'Download standalone .html', onclick: function () {
          download(new Blob([Lx.standaloneHTML(scene, 'Lattice scene')], { type: 'text/html' }), 'lattice-scene.html');
        } }),
        el('button', { class: 'primary', text: 'Copy snippet', onclick: function () {
          (navigator.clipboard ? navigator.clipboard.writeText(code.value) : Promise.reject()).then(function () { toast('Snippet copied'); }, function () { code.select(); document.execCommand('copy'); toast('Snippet copied'); });
        } })
      ])
    ]));
  };

  // ---------- keyboard ----------
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' && e.target.type !== 'range' && e.target.type !== 'checkbox' || tag === 'textarea' || tag === 'select') return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
    else if (e.key === ' ') { e.preventDefault(); setPlaying(!engine.playing); }
    else if (e.key === 'r' && !e.ctrlKey && !e.metaKey) randomize();
    else if (e.key === 'Escape') closeModal();
  });

  function renderAll() {
    $('#aspectSel').value = scene.settings.aspect || '16:9';
    $('#scrub').max = scene.settings.duration;
    layoutFrame(); renderLayers(); renderProps(); updateUndo();
  }
  selected = scene.layers[0] ? scene.layers[0].id : 'scene';
  renderAll();
  window.latticeEditor = { engine: engine, get scene() { return scene; } }; // handy for debugging in the console
