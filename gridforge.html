<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GridMaker</title>
  <meta name="description" content="GridMaker: parametric grid and pattern maker with golden ratio, radial, polygon and modular grids, nested cell canvases, image and text patterns, layers and export.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
/* GridForge UI styles. Colours are tokens; light and dark themes swap them. */
:root {
  --bg: #F2F1EE;
  --panel: #FFFFFF;
  --panel-2: #F7F6F3;
  --line: #E4E2DD;
  --line-2: #D4D1CA;
  --text: #1C1B19;
  --muted: #6D6962;
  --accent: #E2583E;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(226, 88, 62, 0.12);
  --stage: #E6E4DF;
  --hover: rgba(0, 0, 0, 0.05);
  --danger: #C2362B;
  --ok: #2E7D4F;
  --warn: #A76A00;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.14);
  --radius: 8px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #111111;
  --panel: #191919;
  --panel-2: #202020;
  --line: #2B2B2B;
  --line-2: #3A3A3A;
  --text: #ECEAE5;
  --muted: #9C988F;
  --accent: #FF6B4A;
  --accent-ink: #1A0D09;
  --accent-soft: rgba(255, 107, 74, 0.16);
  --stage: #0B0B0B;
  --hover: rgba(255, 255, 255, 0.06);
  --danger: #FF6B5E;
  --ok: #5BC98A;
  --warn: #E7B04B;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) {
    --bg: #111111; --panel: #191919; --panel-2: #202020; --line: #2B2B2B; --line-2: #3A3A3A;
    --text: #ECEAE5; --muted: #9C988F; --accent: #FF6B4A; --accent-ink: #1A0D09; --accent-soft: rgba(255, 107, 74, 0.16);
    --stage: #0B0B0B; --hover: rgba(255, 255, 255, 0.06); color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 13px/1.4 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.gf-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.gf-spacer { flex: 1; }
.gf-muted { color: var(--muted); }

/* ---------- layout ---------- */
.gf-app {
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr) 304px;
  grid-template-rows: 52px minmax(0, 1fr) 30px;
  grid-template-areas: "top top top" "left stage right" "status status status";
  height: 100vh;
  height: 100dvh;
}
.gf-top {
  grid-area: top;
  display: flex; align-items: center; gap: 10px;
  padding: 0 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  min-width: 0;
}
.gf-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; white-space: nowrap; }
.gf-top-group { display: flex; align-items: center; gap: 4px; }
.gf-top-select { max-width: 230px; }

.gf-left, .gf-right {
  background: var(--panel);
  overflow-y: auto;
  min-height: 0;
}
.gf-left { grid-area: left; border-right: 1px solid var(--line); padding: 4px 12px 16px; }
.gf-right { grid-area: right; border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
.gf-left h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 14px 0 8px; }
.gf-sec-head { display: flex; align-items: center; justify-content: space-between; }
.gf-hint { margin: -4px 0 8px; color: var(--muted); font-size: 11.5px; }

.gf-status {
  grid-area: status;
  display: flex; align-items: center; gap: 6px;
  padding: 0 12px;
  font-size: 12px; color: var(--muted);
  background: var(--panel);
  border-top: 1px solid var(--line);
  white-space: nowrap; overflow: hidden;
}
.gf-status-toggle { display: flex; align-items: center; gap: 4px; margin-right: 8px; cursor: pointer; }
.gf-zoom-label { border: 0; background: none; min-width: 52px; font-variant-numeric: tabular-nums; color: var(--text); border-radius: 6px; padding: 2px 6px; }
.gf-zoom-label:hover { background: var(--hover); }

/* ---------- stage ---------- */
.gf-stage-wrap {
  grid-area: stage;
  position: relative;
  overflow: auto;
  display: flex;
  background: var(--stage);
  background-image: radial-gradient(var(--line-2) 1px, transparent 1px);
  background-size: 18px 18px;
  min-width: 0; min-height: 0;
  padding: 24px;
}
.gf-stage-wrap.dropping { box-shadow: inset 0 0 0 3px var(--accent); }
.gf-stage { position: relative; box-shadow: var(--shadow); flex: none; margin: auto; }
.gf-art, .gf-art svg { display: block; width: 100%; height: 100%; }
.gf-overlay { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.gf-overlay .gf-hits path { fill: var(--accent); fill-opacity: 0; stroke: none; cursor: pointer; }
.gf-overlay .gf-hits path:hover { fill-opacity: 0.14; }
.gf-overlay .gf-sel { fill: var(--accent); fill-opacity: 0.2; stroke: var(--accent); pointer-events: none; }
.gf-overlay .gf-active-group { fill: none; stroke: var(--accent); pointer-events: none; }
.gf-overlay .gf-guide { fill: none; stroke: #FF3B7F; pointer-events: none; opacity: 0.8; }
.gf-overlay .gf-marquee { fill: var(--accent); fill-opacity: 0.08; stroke: var(--accent); pointer-events: none; }
.gf-overlay.gf-tool-move .gf-hits path { cursor: move; }
.gf-overlay .gf-objbox { fill: none; stroke: var(--accent); pointer-events: none; }
.gf-overlay .gf-handle { fill: #FFFFFF; stroke: var(--accent); cursor: nwse-resize; }
.gf-overlay .gf-outside { fill: #000000; fill-opacity: 0.45; pointer-events: none; }
.gf-overlay .gf-subedge { fill: none; stroke: var(--accent); pointer-events: none; }
.gf-inline-edit {
  position: absolute; z-index: 3; resize: both; padding: 6px 8px;
  border: 2px solid var(--accent); border-radius: 6px;
  background: var(--panel); color: var(--text); box-shadow: var(--shadow);
  line-height: 1.2;
}
.gf-crumbs {
  position: absolute; top: 8px; left: 8px; z-index: 4;
  display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 4px;
  background: var(--panel); border: 1px solid var(--line-2); border-radius: 999px; box-shadow: var(--shadow);
}
.gf-crumbs[hidden] { display: none; }
.gf-crumb { border: 0; background: none; color: var(--muted); padding: 2px 4px; border-radius: 6px; }
.gf-crumb:hover { background: var(--hover); color: var(--text); }
.gf-crumb.on { color: var(--text); font-weight: 600; }
.gf-seg { background: var(--hover); border-radius: calc(var(--radius) + 2px); padding: 2px; gap: 2px; }
.gf-seg .gf-icon-btn.on { background: var(--panel); color: var(--accent); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15); }
.gf-thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.gf-thumb { position: relative; width: 52px; height: 52px; border: 1px solid var(--line-2); border-radius: 6px; overflow: visible; display: grid; place-items: center; background: var(--hover); }
.gf-thumb img { width: 100%; height: 100%; object-fit: contain; border-radius: 5px; }
.gf-thumb .gf-pal-x { position: absolute; top: -6px; right: -6px; }

/* ---------- buttons & inputs ---------- */
.gf-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 30px; padding: 4px 10px;
  border: 1px solid var(--line-2); border-radius: var(--radius);
  background: var(--panel); color: var(--text);
  font-weight: 500; white-space: nowrap;
}
.gf-btn:hover { background: var(--hover); }
.gf-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.gf-btn.primary:hover { filter: brightness(1.06); }
.gf-btn.danger { color: var(--danger); }
.gf-btn.small { min-height: 26px; padding: 2px 8px; font-size: 12px; }
.gf-btn:disabled, .gf-icon-btn:disabled { opacity: 0.35; cursor: default; }
.gf-icon-btn {
  display: inline-grid; place-items: center;
  width: 30px; height: 30px; padding: 0;
  border: 0; border-radius: var(--radius); background: none; color: var(--text);
}
.gf-icon-btn:hover:not(:disabled) { background: var(--hover); }
select, input[type="number"], input[type="text"], input:not([type]), textarea {
  min-height: 30px;
  padding: 4px 8px;
  border: 1px solid var(--line-2); border-radius: var(--radius);
  background: var(--panel-2);
  min-width: 0;
}
textarea { width: 100%; resize: vertical; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
input[type="checkbox"] { accent-color: var(--accent); }
input[type="checkbox"][role="switch"] {
  appearance: none; -webkit-appearance: none;
  width: 34px; height: 20px; border-radius: 999px; margin: 0;
  background: var(--line-2); position: relative; cursor: pointer; flex: none;
  transition: background 0.15s;
}
input[type="checkbox"][role="switch"]::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 14px; height: 14px; border-radius: 50%; background: #FFF;
  transition: transform 0.15s;
}
input[type="checkbox"][role="switch"]:checked { background: var(--accent); }
input[type="checkbox"][role="switch"]:checked::after { transform: translateX(14px); }
input[type="color"] {
  width: 30px; height: 30px; padding: 2px;
  border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--panel-2);
  cursor: pointer;
}

/* ---------- left column ---------- */
.gf-types { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.gf-type {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 4px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel-2); color: var(--muted); font-size: 11.5px; text-align: center;
}
.gf-type:hover { color: var(--text); border-color: var(--line-2); }
.gf-type.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.gf-type span { color: var(--text); }
.gf-templates { display: grid; gap: 4px; }
.gf-template {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border: 1px solid transparent; border-radius: var(--radius);
  background: none; text-align: left;
}
.gf-template:hover { background: var(--hover); border-color: var(--line); }
.gf-strip { display: flex; width: 42px; height: 14px; border-radius: 4px; overflow: hidden; flex: none; box-shadow: 0 0 0 1px var(--line); }
.gf-strip i { flex: 1; }
.gf-layers { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.gf-layer {
  display: flex; align-items: center; gap: 2px;
  padding: 2px 2px 2px 0; border-radius: var(--radius);
  border: 1px solid transparent; cursor: pointer; user-select: none;
}
.gf-layer:hover { background: var(--hover); }
.gf-layer.on { background: var(--accent-soft); border-color: var(--accent); }
.gf-layer.off .gf-layer-name { opacity: 0.45; }
.gf-layer.dragging { opacity: 0.4; }
.gf-layer.drop { box-shadow: 0 -2px 0 var(--accent); }
.gf-layer .gf-icon-btn { width: 26px; height: 26px; color: var(--muted); }
.gf-layer-ico { display: inline-grid; place-items: center; color: var(--muted); margin-right: 4px; }
.gf-layer-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- right panel ---------- */
.gf-tabs {
  display: flex; gap: 0;
  padding: 8px 6px 0; border-bottom: 1px solid var(--line);
  flex: none; overflow-x: auto; scrollbar-width: none;
}
.gf-tab {
  position: relative; flex: none;
  padding: 6px 6px 8px; border: 0; background: none; color: var(--muted); font-size: 12.5px;
  font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.gf-tab:hover { color: var(--text); }
.gf-tab.on { color: var(--text); border-bottom-color: var(--accent); }
.gf-badge:not(:empty) {
  display: inline-block; margin-left: 4px; padding: 0 5px; min-width: 16px;
  border-radius: 999px; background: var(--accent); color: var(--accent-ink);
  font-size: 10.5px; line-height: 16px; text-align: center;
}
.gf-panel { flex: 1; overflow-y: auto; padding: 4px 14px 24px; min-height: 0; }
.gf-sec {
  margin: 18px 0 8px; padding-top: 12px; border-top: 1px solid var(--line);
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
}
.gf-panel > .gf-sec:first-child { border-top: 0; padding-top: 4px; margin-top: 10px; }
.gf-note { color: var(--muted); font-size: 12px; margin: 4px 0 10px; }
.gf-ctrl { margin: 0 0 12px; }
.gf-range { display: grid; grid-template-columns: minmax(0, 1fr) auto 64px; grid-template-areas: "l k n" "r r r"; align-items: center; gap: 4px 6px; }
.gf-range > label { grid-area: l; color: var(--text); cursor: default; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gf-range > .gf-lock { grid-area: k; }
.gf-range > .gf-num { grid-area: n; }
.gf-range > input[type="range"] { grid-area: r; }
.gf-num { width: 64px; min-height: 26px; padding: 2px 6px; text-align: right; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.gf-num::-webkit-outer-spin-button, .gf-num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.gf-lock {
  display: inline-grid; place-items: center; width: 24px; height: 24px; padding: 0;
  border: 0; border-radius: 6px; background: none; color: var(--muted); opacity: 0.5;
}
.gf-lock:hover { opacity: 1; background: var(--hover); }
.gf-lock.on { opacity: 1; color: var(--accent); }
.gf-field { display: grid; gap: 6px; }
.gf-field > label { color: var(--text); }
.gf-field > select { width: 100%; }
.gf-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; }
.gf-inline { display: flex; gap: 6px; align-items: center; }
.gf-inline > select { flex: 1; }
.gf-stack { display: grid; gap: 8px; margin-bottom: 12px; }
.gf-btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.gf-wh { display: grid; grid-template-columns: auto 1fr auto 1fr auto; gap: 6px; align-items: center; }
.gf-wh .gf-num { width: 100%; }
.gf-swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.gf-sw {
  width: 26px; height: 26px; padding: 0; border-radius: 6px;
  border: 1px solid rgba(0, 0, 0, 0.15); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
}
.gf-sw.on, .gf-sw-custom.on { outline: 2px solid var(--accent); outline-offset: 2px; }
.gf-sw-none { background: linear-gradient(135deg, transparent 45%, var(--danger) 45%, var(--danger) 55%, transparent 55%), var(--panel-2); }
.gf-sw-custom { width: 26px; height: 26px; }
.gf-palette { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.gf-pal-item { position: relative; }
.gf-pal-item input[type="color"] { width: 40px; height: 40px; border-radius: 10px; }
.gf-pal-x {
  position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; padding: 0;
  border-radius: 50%; border: 1px solid var(--line-2); background: var(--panel); color: var(--muted);
  font-size: 12px; line-height: 15px; display: none;
}
.gf-pal-item:hover .gf-pal-x, .gf-pal-x:focus-visible { display: block; }
.gf-pal-add { width: 40px; height: 40px; border-radius: 10px; border: 1px dashed var(--line-2); background: none; color: var(--muted); font-size: 18px; }
.gf-pal-add:hover { color: var(--text); border-color: var(--text); }
.gf-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.gf-chip { padding: 2px 8px; border: 1px solid var(--line-2); border-radius: 999px; background: none; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.gf-chip:hover { background: var(--hover); }
.gf-chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.gf-contrast { margin: -4px 0 12px; font-size: 12px; }
.gf-contrast.ok { color: var(--ok); }
.gf-contrast.mid { color: var(--warn); }
.gf-contrast.bad { color: var(--danger); }

/* ---------- menu, modal, toast ---------- */
.gf-menu-wrap { position: relative; }
.gf-menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 20;
  min-width: 220px; padding: 6px;
  background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow);
  display: grid;
}
.gf-menu[hidden] { display: none; }
.gf-menu button { text-align: left; padding: 7px 10px; border: 0; border-radius: 6px; background: none; }
.gf-menu button:hover, .gf-menu button:focus-visible { background: var(--hover); outline: none; }
.gf-menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.gf-modal {
  width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 64px);
  border: 1px solid var(--line-2); border-radius: 12px; padding: 18px;
  background: var(--panel); color: var(--text); box-shadow: var(--shadow);
}
.gf-modal::backdrop { background: rgba(0, 0, 0, 0.45); }
.gf-modal h3 { margin: 0 0 12px; font-size: 15px; }
.gf-code {
  margin: 0; padding: 12px; max-height: 50vh; overflow: auto;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius);
  font: 12px/1.5 ui-monospace, "SF Mono", Consolas, monospace; white-space: pre;
}
.gf-modal-actions { justify-content: flex-end; margin: 14px 0 0; }
.gf-toast {
  position: fixed; left: 50%; bottom: 44px; transform: translate(-50%, 12px);
  padding: 8px 14px; border-radius: 999px;
  background: var(--text); color: var(--bg); font-weight: 500;
  opacity: 0; pointer-events: none; transition: opacity 0.18s, transform 0.18s; z-index: 30;
}
.gf-toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- embedded mode ---------- */
.gf-embedded .gf-brand span { display: none; }

/* ---------- narrow screens: stack panels under the canvas ---------- */
@media (max-width: 960px) {
  body { overflow: auto; }
  .gf-app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto 58vh auto auto auto;
    grid-template-areas: "top" "stage" "right" "left" "status";
    height: auto; min-height: 100vh;
  }
  .gf-top { flex-wrap: wrap; padding: 8px 12px; }
  .gf-top-select { order: 10; flex: 1 1 100%; max-width: none; }
  .gf-brand span { display: none; }
  #gf-random span { display: none; }
  .gf-right { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .gf-panel { overflow: visible; }
  .gf-left { border-right: 0; border-top: 1px solid var(--line); overflow: visible; }
  .gf-types { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  .gf-stage-wrap { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

</style>
</head>
<body>
  <div class="gf-app">
    <header class="gf-top">
      <div class="gf-brand">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" fill="var(--accent)"/><path d="M9.5 2v20M9.5 14.5H22M15.8 14.5V22" stroke="var(--accent-ink)" stroke-width="1.6" fill="none"/></svg>
        <span>GridMaker</span>
      </div>
      <label class="gf-sr" for="gf-preset">Canvas size</label>
      <select id="gf-preset" class="gf-top-select" title="Template size"></select>
      <div class="gf-top-group gf-seg" role="group" aria-label="Canvas tool">
        <button id="gf-tool-move" class="gf-icon-btn" title="Move tool (V): select, drag, resize; double-click to edit" aria-label="Move tool" aria-pressed="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l14 7-6 2-2 6z"/></svg></button>
        <button id="gf-tool-cells" class="gf-icon-btn" title="Cells tool (C): click or box-select cells" aria-label="Cells tool" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 12h16M12 4v16"/><rect x="12" y="4" width="8" height="8" fill="currentColor" stroke="none" opacity="0.45"/></svg></button>
      </div>

  function buildPanel() {

    for (const it of schema) {
      if (!it || (it.show && !it.show())) continue;
      const el = control(it);
      if (el) panel.append(el);
    }
    panel.scrollTop = scroll;
  }
  const TABS = [['grid', 'Grid'], ['style', 'Colour'], ['pattern', 'Pattern'], ['cells', 'Cells'], ['layer', 'Layer'], ['canvas', 'Canvas']];

      nav.append(h('button', { id: 'gf-tab-' + id, role: 'tab', 'aria-selected': String(tab === id), class: 'gf-tab' + (tab === id ? ' on' : ''), onclick: () => setTab(id) },
        l, id === 'cells' ? h('span', { class: 'gf-badge' }, sel.size ? String(sel.size) : '') : null));
    }

  /* ---------- images & fonts ---------- */
  function readImage(file) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();

      fr.onload = () => {

        const img = new Image();

        img.onload = () => {

          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.9));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  async function addImageFile(file) {

  const loadedFonts = new Set();
  function googleFontURL(name, weight) {

  }
  function ensureFont(name) {

    if (!url) return;
    loadedFonts.add(name);
    document.head.append(h('link', { rel: 'stylesheet', href: url }));
    if (document.fonts) document.fonts.load(`400 40px "${name}"`).then(() => requestRender(), () => {});
  }
  async function registerFont(name, data) {

  }

  /* ---------- export ---------- */
  function fileBase() { return `gridmaker-${root.grid.type}-${root.canvas.w}x${root.canvas.h}`; }
  function download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    notifyParent({ type: 'gridforge:export', name });
  }
  function usedFonts() {
    const m = new Map();
    walkDocs(root, (d) => {
      for (const t of d.texts) {
        const L = d.layers.find((l) => l.id === t.id);
        if (L && L.visible) m.set(t.font + '|' + t.weight, { name: t.font, weight: t.weight });
      }
      const p = d.pattern;
      if (p.on && p.shape === 'text') m.set(p.font + '|' + p.weight, { name: p.font, weight: p.weight });
    });
    return [...m.values()];
  }
  function fontCSSLinked() {
    let css = '';
    const done = new Set();
    for (const f of usedFonts()) {
      if (done.has(f.name)) continue;
      done.add(f.name);
      if (assets.fonts[f.name]) css += `@font-face{font-family:"${f.name}";src:url(${assets.fonts[f.name]});}`;
      else { const u = googleFontURL(f.name); if (u) css = `@import url('${u}');` + css; }
    }
    return css;
  }
  const toDataURL = (blob) => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
  // Inline the font files themselves so text survives SVG -> PNG rasterisation.
  async function fontCSSInline() {
    let css = '';
    for (const f of usedFonts()) {
      if (assets.fonts[f.name]) { css += `@font-face{font-family:"${f.name}";src:url(${assets.fonts[f.name]});}`; continue; }
      const def = FONTS.find((x) => x[0] === f.name);
      if (!def) continue;
      const ws = def[1].split(';').map(Number);
      const w = ws.reduce((a, b) => (Math.abs(b - f.weight) < Math.abs(a - f.weight) ? b : a), ws[0]);
      const txt = await (await fetch(googleFontURL(f.name, w))).text();
      const blocks = txt.split(/(?=\/\*)/).filter((b) => /\/\*\s*latin(-ext)?\s*\*\//.test(b));
      for (let b of blocks) {
        const m = b.match(/url\((https:[^)]+)\)/);
        if (m) b = b.replace(m[1], await toDataURL(await (await fetch(m[1])).blob()));
        css += b;
      }
    }
    return css;
  }
  function svgString(opts) { return RD.build(root, C.generate(root), assets, Object.assign({ uid: 'gf' }, opts)); }
  function exportSVG(guidesOnly) {
    const svg = svgString({ guidesOnly, fontCSS: guidesOnly ? '' : fontCSSLinked() });
    download(new Blob([svg], { type: 'image/svg+xml' }), fileBase() + (guidesOnly ? '-guides' : '') + '.svg');
  }
  async function exportRaster(scale, type) {
    const cv = root.canvas;
    const s = Math.min(scale, 16384 / Math.max(cv.w, cv.h), Math.sqrt(120e6 / (cv.w * cv.h)));
    toast('Rendering ' + (type === 'jpeg' ? 'JPG' : 'PNG') + '…');
    let css = '';
    try { css = await fontCSSInline(); } catch (e) { css = fontCSSLinked(); }
    const url = URL.createObjectURL(new Blob([svgString({ fontCSS: css })], { type: 'image/svg+xml' }));
    try {
      const img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
      const c = document.createElement('canvas');
      c.width = Math.round(cv.w * s); c.height = Math.round(cv.h * s);
      const x = c.getContext('2d');
      if (type === 'jpeg') { x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, c.width, c.height); }
      x.drawImage(img, 0, 0, c.width, c.height);

        download(b, `${fileBase()}@${fmt(s)}x.${type === 'jpeg' ? 'jpg' : 'png'}`);

  function cssCode() {

    const cols = Math.round(p.cols), rows = Math.round(p.rows);

  }
  function bindKeys() {
    document.addEventListener('keydown', (e) => {
      const el = e.target, tag = el.tagName;
      const typing = (tag === 'INPUT' && !/range|checkbox|color|button/.test(el.type)) || tag === 'TEXTAREA' || tag === 'SELECT';
      const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
      if (mod && k === 'z' && !typing) { e.preventDefault(); if (e.shiftKey) doRedo(); else doUndo(); return; }
      if (mod && k === 'y' && !typing) { e.preventDefault(); doRedo(); return; }
      if (typing) return;
      if (e.key === 'Escape') {
        toggleExportMenu(false);
        if (sel.size) { sel.clear(); afterSelect(); }
        else if (activeObject()) { activeLayer = null; buildLayers(); renderOverlay(); if (tab === 'layer') buildPanel(); }
        else if (editPath.length) exitTo(editPath.length - 1);
        return;
      }
      if (/^Arrow/.test(e.key) && !mod) {
        const s = e.shiftKey ? 10 : 1;
        const dx = e.key === 'ArrowLeft' ? -s : e.key === 'ArrowRight' ? s : 0, dy = e.key === 'ArrowUp' ? -s : e.key === 'ArrowDown' ? s : 0;
        if (nudge(dx, dy)) e.preventDefault();
        return;
      }
      if (mod && k === 'g') { e.preventDefault(); mergeSel(); return; }
      if (mod && k === 'a') { e.preventDefault(); sel = new Set(geo.cells.map((c) => c.i)); afterSelect(); return; }
      if (mod && k === 'e') { e.preventDefault(); toggleExportMenu(); return; }

        if (!activeLayer) return;
        e.preventDefault();
        moveLayer(activeLayer, (e.code === 'BracketRight' ? 1 : -1) * (e.shiftKey ? 99 : 1));
        return;
      }
      if (mod) return;
      if (k === 'r') randomise();
      else if (k === 'h') { st.lines.show = !st.lines.show; commit(); requestRender(); if (tab === 'grid') buildPanel(); }
      else if (k === 't') addTextLayer();
      else if (k === 'v') setTool('move');
      else if (k === 'c') setTool('cells');
      else if (e.key === 'Delete' || e.key === 'Backspace') {
        if (sel.size) { e.preventDefault(); applyToSel({ hidden: true }); }
        else if (activeObject()) { e.preventDefault(); deleteLayer(activeLayer); }
      }
      else if (k === '0') setZoom(0);
      else if (k === '=' || k === '+') setZoom((zoom || viewScale) * 1.25);
      else if (k === '-') setZoom((zoom || viewScale) / 1.25);
    });
  }

  /* ---------- embed API (parent page <-> iframe) ---------- */
  function notifyParent(msg) {
    if (window.parent && window.parent !== window) {
      try { window.parent.postMessage(Object.assign({ source: 'gridforge' }, msg), '*'); } catch (e) { /* ignore */ }
    }
  }
  function bindMessages() {

        else if (m.type === 'gridforge:getProject') reply({ type: 'gridforge:project', project: projectData() });
        else if (m.type === 'gridforge:load') { loadProject(m.project); reply({ type: 'gridforge:loaded', ok: true }); }
        else if (m.type === 'gridforge:template') { applyTemplate(m.template); reply({ type: 'gridforge:loaded', ok: true }); }

      } catch (err) { reply({ type: 'gridforge:error', error: String(err && err.message || err) }); }
    });
  }

  /* ---------- init ---------- */
  function init() {
    if (EMBED) document.documentElement.classList.add('gf-embedded');
    let theme = params.get('theme');
    if (!theme) { try { theme = localStorage.getItem('gridforge:theme'); } catch (e) { theme = null; } }
    if (!theme) theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);

    let loaded = false;
    const tpl = params.get('template');
    if (!tpl) {
      try {
        const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
        if (saved && saved.state) { loadProject(saved); loaded = true; }
      } catch (e) { /* no autosave */ }
    }
    bindTop(); bindKeys(); bindCanvas(); bindMessages(); buildTemplates();
    if (!loaded) { root = st = fromTemplate(tpl || 'golden'); resetHistory(); }
    setTool(tool);
    refreshAll();
    notifyParent({ type: 'gridforge:ready' });
  }

  G.app = { getState: () => root, svg: () => svgString({ fontCSS: fontCSSLinked() }), load: loadProject, template: applyTemplate };
  init();
})(window.GridForge = window.GridForge || {});
